<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <!-- Lobster silhouette — clean, geometric -->
  <g stroke="#863bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Tail segments -->
    <path d="M24 44c-4-2-6-6-6-10v-4"/>
    <path d="M24 44c4-2 6-6 6-10v-4"/>
    <!-- Body (carapace) -->
    <path d="M18 30c0-4 2-8 6-8s6 4 6 8"/>
    <!-- Head/rostrum -->
    <path d="M24 22v-6"/>
    <path d="M24 16c-2 0-4-2-4-4s2-4 4-4 4 2 4 4-2 4-4 4z"/>
    <!-- Antennae -->
    <path d="M20 14c-3-2-6-1-8 2"/>
    <path d="M28 14c3-2 6-1 8 2"/>
    <!-- Left claw arm -->
    <path d="M18 26c-4-1-8-3-10-6"/>
    <path d="M8 20c-1 1-2 3-1 4s2 1 2 0 1-2 0-3c-1-1-3 0-3 2"/>
    <path d="M8 20c-1-1-2-1-2 0"/>
    <!-- Right claw arm -->
    <path d="M30 26c4-1 8-3 10-6"/>
    <path d="M40 20c1 1 2 3 1 4s-2 1-2 0-1-2 0-3c1-1 3 0 3 2"/>
    <path d="M40 20c1-1 2-1 2 0"/>
    <!-- Walking legs left -->
    <path d="M18 28c-2 0-4 2-4 4"/>
    <path d="M18 30c-2 1-4 3-3 5"/>
    <path d="M18 32c-2 1-3 3-2 5"/>
    <!-- Walking legs right -->
    <path d="M30 28c2 0 4 2 4 4"/>
    <path d="M30 30c2 1 4 3 3 5"/>
    <path d="M30 32c2 1 3 3 2 5"/>
    <!-- Tail fan -->
    <path d="M18 34c-2 2-2 5 0 6"/>
    <path d="M30 34c2 2 2 5 0 6"/>
    <path d="M20 34c-1 2 0 4 4 4"/>
    <path d="M28 34c1 2 0 4-4 4"/>
  </g>
</svg>