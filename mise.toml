[tools]
node = "24.12.0"
wrangler = "latest"
python = "3.12.11"

[env]
PYTHONUNBUFFERED = "1"

# ---------------------------------------------------------------------------
# Tasks (run with: mise run <task>)
# Prefer `dir = "..."` over `cd … &&` — more reliable on Windows (mise's
# default shell is cmd) and avoids PowerShell/`&&` quirks. Package scripts
# (`npm run …`) use each package's own wrangler from node_modules, so we
# don't depend on the mise-global wrangler shim for Worker/loader work.
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Local Copilot stack: Worker :8787 + frontend :5173 (parallel)"
run = [{ tasks = ["worker-dev", "frontend"] }]

[tasks.sync]
description = "Install Node dependencies (frontend + worker)"
run = "npm --prefix frontend install && npm --prefix worker install"

[tasks.frontend]
description = "Run the Vite dev server on http://127.0.0.1:5173 (proxies /api + /agents → :8787)"
dir = "frontend"
run = "npm run dev"

[tasks.worker-dev]
description = "Run the screener-api Worker locally on http://127.0.0.1:8787 (reads secrets from worker/.dev.vars)"
dir = "worker"
run = "npm run dev"

[tasks.worker-deploy]
description = "Deploy the screener-api Worker to Cloudflare (api.lobster.mp + workers.dev). Set R2_SQL_TOKEN via: cd worker && npx wrangler secret put R2_SQL_TOKEN"
dir = "worker"
run = "npm run deploy"

[tasks.build]
description = "Build the production frontend bundle"
dir = "frontend"
run = "npm run build"


# ---------------------------------------------------------------------------
# Loader (loader/) — CBOE → Cloudflare Pipelines → R2 Data Catalog
# ---------------------------------------------------------------------------
[tasks.loader-install]
description = "Install loader Node dependencies (@cloudflare/containers, wrangler)"
dir = "loader"
run = "npm ci"

[tasks.loader-types]
description = "Generate and check loader Worker bindings"
dir = "loader"
run = "npx wrangler types && npx wrangler types --check"

[tasks.loader-dev]
description = "Run the cboe-to-r2 loader Worker locally"
dir = "loader"
run = "npm run dev"

[tasks.loader-deploy]
description = "Deploy the cboe-to-r2 loader Worker and container. Set LOADER_TOKEN via: cd loader && npx wrangler secret put LOADER_TOKEN"
dir = "loader"
run = "npm run deploy"

[tasks.loader-validate]
description = "Validate loader Wrangler config without a container rollout"
dir = "loader"
run = "npx wrangler deploy --dry-run --containers-rollout=none"

[tasks.loader-container-build]
description = "Build the loader image with Podman (linux/amd64)"
dir = "loader"
run = "podman build --platform linux/amd64 -t cboe-to-r2-poc ."

[tasks.loader-container-run]
description = "Run the loader locally in stdout mode"
dir = "loader"
run = "podman run --rm -p 8080:8080 -e WRITE_MODE=stdout cboe-to-r2-poc"
