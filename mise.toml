[tools]
node = "24.12.0"
wrangler = "latest"
python = "3.12.11"
uv = "latest"

[env]
PYTHONUNBUFFERED = "1"

# ---------------------------------------------------------------------------
# Tasks (run with: mise run <task>)
# NOTE: mise on Windows only executes the first line of a multi-line `run`
# script, so multi-step tasks must be chained on a single line with `&&`.
# ---------------------------------------------------------------------------
[tasks.sync]
description = "Install Node dependencies (frontend + worker)"
run = "cd frontend && npm install && cd ../worker && npm install"

[tasks.frontend]
description = "Run the Vite dev server on http://127.0.0.1:5173 (calls the screener-api Worker via VITE_API_BASE)"
run = "cd frontend && npm run dev"

[tasks.worker-dev]
description = "Run the screener-api Worker locally on http://127.0.0.1:8787 (reads R2_SQL_TOKEN from worker/.dev.vars)"
run = "cd worker && npx wrangler dev"

[tasks.worker-deploy]
description = "Deploy the screener-api Worker to Cloudflare (api.lobster.mp + workers.dev). Set R2_SQL_TOKEN via: cd worker && npx wrangler secret put R2_SQL_TOKEN"
run = "cd worker && npx wrangler deploy"

[tasks.build]
description = "Build the production frontend bundle"
run = "cd frontend && npm run build"


# ---------------------------------------------------------------------------
# Loader (loader/) — CBOE → Cloudflare Pipelines → R2 Data Catalog
# Run from the repo root; tasks cd into loader/ themselves.
# ---------------------------------------------------------------------------
[tasks.loader-install]
description = "Install loader Node dependencies (@cloudflare/containers, wrangler)"
run = "cd loader && npm ci"

[tasks.loader-types]
description = "Generate and check loader Worker bindings"
run = "cd loader && npx wrangler types && npx wrangler types --check"

[tasks.loader-dev]
description = "Run the cboe-to-r2 loader Worker locally"
run = "cd loader && npx wrangler dev"

[tasks.loader-deploy]
description = "Deploy the cboe-to-r2 loader Worker and container. Set LOADER_TOKEN via: cd loader && npx wrangler secret put LOADER_TOKEN"
run = "cd loader && npx wrangler deploy"

[tasks.loader-validate]
description = "Validate loader Wrangler config without a container rollout"
run = "cd loader && npx wrangler deploy --dry-run --containers-rollout=none"

[tasks.loader-container-build]
description = "Build the loader image with Podman (linux/amd64)"
run = "cd loader && podman build --platform linux/amd64 -t cboe-to-r2-poc ."

[tasks.loader-container-run]
description = "Run the loader locally in stdout mode"
run = "cd loader && podman run --rm -p 8080:8080 -e WRITE_MODE=stdout cboe-to-r2-poc"

# ---------------------------------------------------------------------------
# Research notebooks (notebooks/) — marimo + DuckDB via uv
# Do not load root .env here: mise's dotenv parser cannot handle the
# multi-line Kalshi PEM. Notebooks load .env via python-dotenv instead.
# ---------------------------------------------------------------------------
[tasks.notebooks-sync]
description = "Install marimo notebook deps with uv (Python 3.12 from mise)"
run = "cd notebooks && uv sync --python 3.12.11"

[tasks.notebooks]
description = "Open marimo research notebooks (uv; --no-token for marimo-pair)"
depends = ["notebooks-sync"]
run = "cd notebooks && uv run marimo edit apps --no-token --host 127.0.0.1 --port 2718"

[tasks.notebooks-export-marimo]
description = "Export lake_tape_backtest to executed HTML and upload to private R2"
depends = ["notebooks-sync"]
run = "node notebooks/tools/export_marimo_to_r2.mjs"