[project]
name = "lobster-nb"
version = "0.1.0"
description = "Marimo research notebooks for the options lake and Kalshi parlays"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "duckdb>=1.4.0",
    "httpx>=0.27",
    "marimo[sql]>=0.24.2",
    "polars>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
