name: Deploy loader (Worker)

# Deploys the `cboe-to-r2` loader Worker (CBOE → Pipelines → R2 Data Catalog
# Iceberg tables) to Cloudflare. The CBOE fetch + normalize + publish path runs
# in-process (runSymbols) — there is no container. Lives in the monorepo under
# `loader/`.
#
# Auto-deploys on every push to `main` (matching the screener/frontend
# `deploy.yml`). DEPRECATION NOTE: this was previously manual until
# full-refresh validation; auto-deploy now ships any loader change to prod on
# commit — review carefully before pushing behavior changes. There is no dev
# instance, so only `main` deploys (no branch/PR).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN — Worker deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
# LOADER_TOKEN and the rotated PIPELINE_*_URL / PIPELINE_AUTH_TOKEN are set
# once on the deployed Worker via `wrangler secret put` and persist across
# deploys, so CI does not need them for Pipeline ingest. Research brief warming
# needs RESEARCH_API_BASE + ADMIN_TOKEN on every deploy (synced below from
# GitHub secrets) — without them `research-briefs-daily` dry-runs forever.
# The ingest URLs are unauthenticated
# write endpoints (the subdomain IS the credential) and must NEVER be
# committed — see SECURITY-AUDIT.md (CRITICAL). Set them after rotating any
# leaked URLs in the Cloudflare dashboard:
#   npx wrangler secret put PIPELINE_RUNS_URL
#   npx wrangler secret put PIPELINE_CONTRACTS_URL
#   npx wrangler secret put PIPELINE_UNDERLYINGS_URL
#   npx wrangler secret put PIPELINE_ERRORS_URL        # empty to disable
#   npx wrangler secret put PIPELINE_AUTH_TOKEN        # required (streams are authenticated)
#   npx wrangler secret put PIPELINE_SEC_FILINGS_URL   # stream cboe_sec_filings_v2 (sec-filings-daily)

# Cancel superseded runs on the same ref so we don't pile up deploys.
concurrency:
  group: deploy-loader-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Invariant guard: every loader secret must live in BOTH the Worker
      # (wrangler secret put — preserved across redeploys) AND GitHub secrets
      # (the de-facto token store). LOADER_TOKEN was Worker-only once and the
      # operator lever (force-loader-pass.yml) silently couldn't auth. Fail the
      # deploy loudly instead of letting the invariant degrade again.
      - name: Verify LOADER_TOKEN is in GitHub secrets
        env:
          LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
        run: |
          if [ -z "${LOADER_TOKEN:-}" ]; then
            echo "::error::LOADER_TOKEN is missing from GitHub secrets. Rerun: gh secret set LOADER_TOKEN (same value as the Worker secret), then deploy again."
            exit 1
          fi
          echo "LOADER_TOKEN present — Worker secret must match (set via wrangler secret put)."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loader/package-lock.json

      - name: Install loader dependencies
        run: cd loader && npm ci

      # D1 migrations are NOT applied by `wrangler deploy`. Apply them to the
      # remote D1 first so the scheduler's `job_state` ledger (and any future
      # schema) exists before the new Worker starts writing it. Idempotent —
      # already-applied tags are skipped.
      - name: Apply D1 migrations
        run: cd loader && npx wrangler d1 migrations apply cboe-loader-state --remote

      - name: Deploy Worker
        run: cd loader && npx wrangler deploy

      # research-briefs-daily POSTs to the API Worker. Without these secrets the
      # job reports success while dry-running (no D1 warm). Sync on every deploy
      # so a merge of the warm job cannot land "green" but inert in prod.
      - name: Sync research brief warm secrets
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          cd loader
          printf '%s' 'https://api.lobster.mp' | npx wrangler secret put RESEARCH_API_BASE
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::warning::ADMIN_TOKEN missing from GitHub secrets — research-briefs-daily will keep dry-running"
            exit 0
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          echo "RESEARCH_API_BASE + ADMIN_TOKEN synced onto cboe-to-r2"
