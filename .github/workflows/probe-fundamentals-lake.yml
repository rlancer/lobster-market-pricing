name: Probe fundamentals lake (one-shot)

# Throwaway PR-branch check: provision cboe_fundamentals_* if missing, publish
# a few probe rows (AAPL/MSFT/GOOGL), wait for the ~300s sink roll, then assert
# AAPL is queryable via the production Worker /api/query (R2 SQL Read tokens are
# Worker secrets, not always mirrored in GitHub — the public query path uses the
# Worker's R2_SQL_TOKEN). Uses existing repo secrets for provision + ingest.
#
# Delete or comment this workflow out once green on the PR (do not leave a
# permanent flaky lake probe on every push).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: probe-fundamentals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      PIPELINE_AUTH_TOKEN: ${{ secrets.PIPELINE_AUTH_TOKEN }}
      WRANGLER_R2_SQL_AUTH_TOKEN: ${{ secrets.WRANGLER_R2_SQL_AUTH_TOKEN }}
      R2_SQL_TOKEN: ${{ secrets.R2_SQL_TOKEN }}
      BUCKET: cboe-options-data
      WAREHOUSE: 3315bb3e7d2e3556bfea6fb3947a890e_cboe-options-data
      STREAM: cboe_fundamentals_v2
      SINK: cboe_fundamentals_sink
      PIPELINE: cboe_fundamentals_pipeline
      NAMESPACE: options
      TABLE: fundamentals
      WORKER_QUERY_URL: https://screener-api.robertlancer.workers.dev/api/query
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require secrets
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_DATA_CATALOG_TOKEN PIPELINE_AUTH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # Optional: prefer wrangler r2 sql when a read token is present.
          if [ -n "${WRANGLER_R2_SQL_AUTH_TOKEN:-}" ] || [ -n "${R2_SQL_TOKEN:-}" ]; then
            echo "WRANGLER_R2_SQL_AUTH_TOKEN=${WRANGLER_R2_SQL_AUTH_TOKEN:-$R2_SQL_TOKEN}" >> "$GITHUB_ENV"
            echo "HAVE_R2_SQL_TOKEN=1" >> "$GITHUB_ENV"
          else
            echo "HAVE_R2_SQL_TOKEN=0" >> "$GITHUB_ENV"
            echo "No WRANGLER_R2_SQL_AUTH_TOKEN/R2_SQL_TOKEN in GitHub — will assert via Worker /api/query."
          fi
          echo "Secrets present (values not printed)."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loader/package-lock.json

      - name: Install loader dependencies
        run: cd loader && npm ci

      - name: Provision stream + sink + pipeline (idempotent)
        working-directory: loader
        run: |
          set -euo pipefail

          if npx wrangler pipelines streams get "$STREAM" --json >/tmp/fund-stream.json 2>/dev/null; then
            echo "Stream $STREAM already exists"
          else
            echo "Creating stream $STREAM"
            npx wrangler pipelines streams create "$STREAM" \
              --schema-file schemas/fundamentals.json \
              --http-enabled true \
              --http-auth true
            npx wrangler pipelines streams get "$STREAM" --json >/tmp/fund-stream.json
          fi

          ENDPOINT=$(node -e 'const s=require("/tmp/fund-stream.json"); if(!s.endpoint) process.exit(2); process.stdout.write(s.endpoint)')
          echo "PIPELINE_FUNDAMENTALS_URL set (endpoint not printed)."
          echo "PIPELINE_FUNDAMENTALS_URL=$ENDPOINT" >> "$GITHUB_ENV"

          if npx wrangler pipelines sinks get "$SINK" --json >/tmp/fund-sink.json 2>/dev/null; then
            echo "Sink $SINK already exists"
          else
            echo "Creating sink $SINK (creates options.fundamentals)"
            # catalog-token is required by wrangler; value is not echoed.
            npx wrangler pipelines sinks create "$SINK" \
              --type r2-data-catalog \
              --bucket "$BUCKET" \
              --namespace "$NAMESPACE" \
              --table "$TABLE" \
              --catalog-token "$R2_DATA_CATALOG_TOKEN" \
              --format parquet \
              --roll-interval 300
          fi

          if npx wrangler pipelines get "$PIPELINE" --json >/tmp/fund-pipeline.json 2>/dev/null; then
            echo "Pipeline $PIPELINE already exists"
          else
            echo "Creating pipeline $PIPELINE"
            npx wrangler pipelines create "$PIPELINE" \
              --sql "INSERT INTO ${SINK} SELECT * FROM ${STREAM}"
          fi

      - name: Publish probe fundamentals rows
        working-directory: loader
        run: |
          set -euo pipefail
          node tools/fundamentals_probe_publish.ts AAPL MSFT GOOGL

      - name: Set loader Worker secret PIPELINE_FUNDAMENTALS_URL
        working-directory: loader
        run: |
          set -euo pipefail
          printf '%s' "$PIPELINE_FUNDAMENTALS_URL" | npx wrangler secret put PIPELINE_FUNDAMENTALS_URL
          echo "Worker secret PIPELINE_FUNDAMENTALS_URL updated."

      - name: Wait for sink roll (~5 min)
        run: |
          echo "Lake sinks flush on a ~300s roll interval — waiting 360s for probe rows."
          sleep 360

      - name: Assert AAPL fundamentals via lake query
        working-directory: loader
        run: |
          set -euo pipefail
          QUERY="SELECT ticker, market_cap, trailing_pe, source FROM options.fundamentals WHERE ticker = 'AAPL' ORDER BY fetched_at DESC LIMIT 5"
          echo "Running: $QUERY"

          if [ "${HAVE_R2_SQL_TOKEN:-0}" = "1" ]; then
            set +e
            out=$(npx wrangler r2 sql query "$WAREHOUSE" "$QUERY" 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -ne 0 ]; then
              echo "::error::R2 SQL query failed"
              exit 1
            fi
            if ! echo "$out" | grep -qi 'AAPL'; then
              echo "::error::No AAPL row in options.fundamentals — probe did not land"
              exit 1
            fi
          else
            # Worker /api/query uses the deployed R2_SQL_TOKEN (Worker secret).
            body=$(jq -nc --arg sql "$QUERY" '{sql:$sql, limit:5}')
            set +e
            resp=$(curl -sS -X POST "$WORKER_QUERY_URL" \
              -H 'content-type: application/json' \
              -d "$body" \
              -w '\n__HTTP_%{http_code}')
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::error::Worker /api/query request failed"
              exit 1
            fi
            http="${resp##*__HTTP_}"
            json="${resp%__HTTP_*}"
            echo "$json"
            if [ "$http" != "200" ]; then
              echo "::error::Worker /api/query returned HTTP $http"
              exit 1
            fi
            if ! echo "$json" | grep -qi 'AAPL'; then
              echo "::error::No AAPL row in options.fundamentals — probe did not land"
              exit 1
            fi
            row_count=$(echo "$json" | jq -r '.row_count // 0')
            if [ "${row_count}" = "0" ]; then
              echo "::error::options.fundamentals returned 0 rows for AAPL"
              exit 1
            fi
          fi
          echo "AAPL fundamentals present in lake."
