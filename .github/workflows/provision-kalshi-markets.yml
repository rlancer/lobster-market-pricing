name: Provision Kalshi markets pipeline

# One-shot: create cboe_kalshi_markets_* if missing, set PIPELINE_KALSHI_MARKETS_URL,
# redeploy loader so the DO sees the secret, force kalshi-markets-hourly, wait for
# the ~300s sink roll, then assert rows via production /api/query.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_DATA_CATALOG_TOKEN,
#   PIPELINE_AUTH_TOKEN, LOADER_TOKEN
# Optional: PIPELINES_ADMIN_TOKEN (Pipelines Edit if deploy token lacks it)
#
# Trigger: workflow_dispatch, or push to cursor/run-provision-kalshi-markets-f300
# (gh workflow_dispatch is 403 for the Cursor integration token).

on:
  workflow_dispatch:
  push:
    branches: ['cursor/run-provision-kalshi-markets-f300']

concurrency:
  group: provision-kalshi-markets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      PIPELINE_AUTH_TOKEN: ${{ secrets.PIPELINE_AUTH_TOKEN }}
      PIPELINES_ADMIN_TOKEN: ${{ secrets.PIPELINES_ADMIN_TOKEN }}
      LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
      STREAM: cboe_kalshi_markets_v2
      SINK: cboe_kalshi_markets_sink
      PIPELINE: cboe_kalshi_markets_pipeline
      BUCKET: cboe-options-data
      LOADER_URL: https://cboe-to-r2.robertlancer.workers.dev
      WORKER_QUERY_URL: https://api.lobster.mp/api/query
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require secrets
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_DATA_CATALOG_TOKEN PIPELINE_AUTH_TOKEN LOADER_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Secrets present (values not printed)."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loader/package-lock.json

      - name: Install loader dependencies
        run: cd loader && npm ci

      - name: Provision stream / sink / pipeline
        working-directory: loader
        run: |
          set -euo pipefail

          PIPELINES_TOKEN="${PIPELINES_ADMIN_TOKEN:-}"
          if [ -z "$PIPELINES_TOKEN" ]; then
            PIPELINES_TOKEN="$CLOUDFLARE_API_TOKEN"
          fi

          wrangler_pipelines() {
            CLOUDFLARE_API_TOKEN="$PIPELINES_TOKEN" npx wrangler "$@"
          }

          try_list() {
            wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
              && return 0
            if [ "$PIPELINES_TOKEN" != "$R2_DATA_CATALOG_TOKEN" ]; then
              echo "Deploy token cannot list pipelines — retrying with R2_DATA_CATALOG_TOKEN"
              PIPELINES_TOKEN="$R2_DATA_CATALOG_TOKEN"
              wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
                && return 0
            fi
            echo "::error::No available token can manage Pipelines (need Pipelines Edit)."
            cat /tmp/streams.err >&2 || true
            return 1
          }
          try_list

          # Open-beta hard cap: 20 streams / 20 sinks / 20 pipelines per account.
          # Free one slot for Kalshi by (1) deleting retired/orphaned resources,
          # then (2) pausing reg_sho ingest (niche FINRA daily short-sale feed).
          # options.reg_sho_daily Iceberg rows remain readable; the job dry-runs
          # once PIPELINE_REG_SHO_URL is cleared. Re-provision after a Pipelines
          # limit increase: https://developers.cloudflare.com/pipelines/platform/limits/
          echo "Current streams:"
          node -e 'const s=require("/tmp/streams.json"); const arr=Array.isArray(s)?s:(s.result||s.streams||[]); console.log("count="+arr.length); for (const x of arr) console.log(" -", x.name||x.id||JSON.stringify(x).slice(0,80));'

          free_retired_slot() {
            local name
            for name in \
              cboe_underlyings_pipeline cboe_symbol_load_errors_pipeline \
              cboe_underlyings_v1_pipeline cboe_instruments_pipeline; do
              if wrangler_pipelines pipelines get "$name" --json >/dev/null 2>&1; then
                echo "Deleting pipeline $name (retired/orphaned — frees quota)"
                wrangler_pipelines pipelines delete "$name" -y || true
              fi
            done
            for name in \
              cboe_underlyings_sink cboe_symbol_load_errors_sink \
              cboe_underlyings_v1_sink cboe_instruments_sink; do
              if wrangler_pipelines pipelines sinks get "$name" --json >/dev/null 2>&1; then
                echo "Deleting sink $name (retired/orphaned — frees quota)"
                wrangler_pipelines pipelines sinks delete "$name" -y || true
              fi
            done
            for name in \
              cboe_underlyings_v2 cboe_underlyings_v1 \
              cboe_symbol_load_errors_v2 cboe_symbol_load_errors_v1 \
              cboe_instruments_v2; do
              if wrangler_pipelines pipelines streams get "$name" --json >/dev/null 2>&1; then
                echo "Deleting stream $name (retired/orphaned — frees Pipelines quota slot)"
                wrangler_pipelines pipelines streams delete "$name" -y || true
              fi
            done
          }

          # Pause reg_sho ingest to free the 20th stream slot for Kalshi.
          pause_reg_sho_for_quota() {
            if wrangler_pipelines pipelines streams get "$STREAM" --json >/dev/null 2>&1; then
              echo "Kalshi stream already exists — not touching reg_sho"
              return 0
            fi
            if ! wrangler_pipelines pipelines streams get cboe_reg_sho_daily_v2 --json >/dev/null 2>&1; then
              echo "reg_sho stream already absent"
              return 0
            fi
            echo "Pausing reg_sho ingest (cboe_reg_sho_daily_*) to free Pipelines quota for Kalshi"
            wrangler_pipelines pipelines delete cboe_reg_sho_daily_pipeline -y || true
            wrangler_pipelines pipelines sinks delete cboe_reg_sho_daily_sink -y || true
            wrangler_pipelines pipelines streams delete cboe_reg_sho_daily_v2 -y || true
            # Clear loader secret so reg-sho-daily dry-runs (no failing POSTs).
            printf '' | npx wrangler secret put PIPELINE_REG_SHO_URL || true
          }

          free_retired_slot
          pause_reg_sho_for_quota
          try_list
          echo "Streams after quota relief:"
          node -e 'const s=require("/tmp/streams.json"); const arr=Array.isArray(s)?s:(s.result||s.streams||[]); console.log("count="+arr.length); for (const x of arr) console.log(" -", x.name||x.id);'

          create_stream() {
            wrangler_pipelines pipelines streams create "$STREAM" \
              --schema-file schemas/kalshi_markets.json \
              --http-enabled true \
              --http-auth true
          }

          if wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json" 2>/dev/null; then
            echo "Stream $STREAM already exists"
          else
            echo "Creating stream $STREAM"
            if ! create_stream 2>/tmp/create_stream.err; then
              if grep -q 'Quota exceeded\|code: 1017' /tmp/create_stream.err; then
                echo "Quota exceeded — listing streams and retrying after retired cleanup"
                cat /tmp/create_stream.err >&2 || true
                try_list
                free_retired_slot
                # Last resort: if an unused smoke/test stream exists, drop it.
                node -e '
                  const s=require("/tmp/streams.json");
                  const arr=Array.isArray(s)?s:(s.result||s.streams||[]);
                  const names=arr.map(x=>x.name).filter(Boolean);
                  const drop=names.filter(n=>/smoke|test|zzz|probe|underlyings|load_errors/i.test(n));
                  console.log(drop.join("\n"));
                ' >/tmp/drop_candidates.txt
                while IFS= read -r name; do
                  [ -z "$name" ] && continue
                  [ "$name" = "$STREAM" ] && continue
                  echo "Deleting quota-relief candidate stream $name"
                  wrangler_pipelines pipelines streams delete "$name" -y || true
                done < /tmp/drop_candidates.txt
                create_stream
              else
                cat /tmp/create_stream.err >&2
                exit 1
              fi
            fi
            wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json"
          fi

          ENDPOINT=$(node -e "const s=require('/tmp/${STREAM}.json'); if(!s.endpoint) process.exit(2); process.stdout.write(s.endpoint)")
          echo "PIPELINE_KALSHI_MARKETS_URL=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Stream endpoint captured (value not printed)."

          if wrangler_pipelines pipelines sinks get "$SINK" --json >"/tmp/${SINK}.json" 2>/dev/null; then
            echo "Sink $SINK already exists"
          else
            echo "Creating sink $SINK (creates options.kalshi_markets)"
            if ! wrangler_pipelines pipelines sinks create "$SINK" \
              --type r2-data-catalog \
              --bucket "$BUCKET" \
              --namespace options \
              --table kalshi_markets \
              --catalog-token "$R2_DATA_CATALOG_TOKEN" \
              --format parquet \
              --roll-interval 300 2>/tmp/create_sink.err; then
              if grep -q 'Quota exceeded\|code: 1017' /tmp/create_sink.err; then
                echo "Sink quota exceeded — deleting retired sinks and retrying"
                cat /tmp/create_sink.err >&2 || true
                free_retired_slot
                wrangler_pipelines pipelines sinks create "$SINK" \
                  --type r2-data-catalog \
                  --bucket "$BUCKET" \
                  --namespace options \
                  --table kalshi_markets \
                  --catalog-token "$R2_DATA_CATALOG_TOKEN" \
                  --format parquet \
                  --roll-interval 300
              else
                cat /tmp/create_sink.err >&2
                exit 1
              fi
            fi
          fi

          if wrangler_pipelines pipelines get "$PIPELINE" --json >"/tmp/${PIPELINE}.json" 2>/dev/null; then
            echo "Pipeline $PIPELINE already exists"
          else
            echo "Creating pipeline $PIPELINE"
            if ! wrangler_pipelines pipelines create "$PIPELINE" \
              --sql "INSERT INTO ${SINK} SELECT * FROM ${STREAM}" 2>/tmp/create_pipeline.err; then
              if grep -q 'Quota exceeded\|code: 1017' /tmp/create_pipeline.err; then
                echo "Pipeline quota exceeded — deleting retired pipelines and retrying"
                cat /tmp/create_pipeline.err >&2 || true
                free_retired_slot
                wrangler_pipelines pipelines create "$PIPELINE" \
                  --sql "INSERT INTO ${SINK} SELECT * FROM ${STREAM}"
              else
                cat /tmp/create_pipeline.err >&2
                exit 1
              fi
            fi
          fi

      - name: Set PIPELINE_KALSHI_MARKETS_URL Worker secret
        working-directory: loader
        run: |
          set -euo pipefail
          printf '%s' "$PIPELINE_KALSHI_MARKETS_URL" | npx wrangler secret put PIPELINE_KALSHI_MARKETS_URL
          echo "Worker secret PIPELINE_KALSHI_MARKETS_URL updated."

      - name: Redeploy loader so EtlScheduler DO picks up the secret
        working-directory: loader
        run: |
          set -euo pipefail
          npx wrangler deploy
          echo "cboe-to-r2 redeployed."

      - name: Publish sample series directly (bypass DO)
        working-directory: loader
        run: |
          set -euo pipefail
          # Full curated allowlist — not just a sample — so the lake is useful
          # immediately even if the DO trigger races a main-branch loader deploy.
          # Paced (see tools/kalshi_probe_publish.mjs) to leave headroom for Force.
          node tools/kalshi_probe_publish.mjs

      - name: Cooldown before Worker Force (Kalshi rate budget)
        run: |
          echo "Waiting 90s so Worker-path Force does not share a hot Kalshi rate window with direct publish."
          sleep 90

      - name: Force kalshi-markets-hourly (Worker path)
        run: |
          set -euo pipefail
          sleep 5
          before_at=$(curl -sS "$LOADER_URL/jobs/kalshi-markets-hourly" | jq -r '.job.last_pass.finished_at // .job.last_pass.at // empty')
          # async=1 returns immediately; paced Kalshi pass finishes in the DO.
          set +e
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $LOADER_TOKEN" \
            -m 60 \
            -w '\n__HTTP_%{http_code}' \
            "$LOADER_URL/jobs/kalshi-markets-hourly/trigger?force=1&async=1")
          curl_ec=$?
          set -e
          if [ "$curl_ec" -ne 0 ]; then
            echo "::warning::Worker trigger curl exit $curl_ec — polling job status"
          else
            body="${resp%__HTTP_*}"
            code="${resp##*__HTTP_}"
            echo "$body"
            if [ "$code" = "409" ]; then
              echo "Loader busy (409) — waiting for in-flight pass to finish."
            elif [ "$code" != "200" ] || ! echo "$body" | grep -q '"ok":true'; then
              echo "::warning::Worker trigger returned HTTP $code — direct publish still counts"
            fi
          fi
          # Poll until last_pass.finished_at advances (run_id may be null on timeout).
          for i in $(seq 1 60); do
            status=$(curl -sS "$LOADER_URL/jobs/kalshi-markets-hourly")
            after_at=$(echo "$status" | jq -r '.job.last_pass.finished_at // .job.last_pass.at // empty')
            failed=$(echo "$status" | jq -r '.job.last_pass.failed // 0')
            succeeded=$(echo "$status" | jq -r '.job.last_pass.succeeded // 0')
            run_id=$(echo "$status" | jq -r '.job.last_pass.run_id // empty')
            echo "poll $i: finished_at=$after_at run_id=$run_id succeeded=$succeeded failed=$failed"
            if [ -n "$after_at" ] && [ "$after_at" != "$before_at" ]; then
              echo "$status" | jq '{job_id:.job.job_id, last_pass:(.job.last_pass|{run_id,duration_ms,failed,succeeded,attempted,finished_at,transport_error})}'
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Timed out waiting for new last_pass — continuing (direct publish may still count)"
          curl -sS "$LOADER_URL/jobs/kalshi-markets-hourly" | jq '{job_id:.job.job_id, last_pass:(.job.last_pass|{run_id,duration_ms,failed,succeeded,attempted,finished_at,transport_error})}'

      - name: Wait for sink roll (~5 min)
        run: |
          echo "Lake sinks flush on a ~300s roll interval — waiting 360s."
          sleep 360

      - name: Assert kalshi_markets rows
        run: |
          set -euo pipefail
          assert_sql() {
            local sql="$1" expect="$2" label="$3"
            local attempt max=8
            body=$(jq -nc --arg sql "$sql" '{sql:$sql, limit:20}')
            for attempt in $(seq 1 "$max"); do
              resp=$(curl -sS -X POST "$WORKER_QUERY_URL" \
                -H 'content-type: application/json' \
                -d "$body" \
                -w '\n__HTTP_%{http_code}')
              http="${resp##*__HTTP_}"
              json="${resp%__HTTP_*}"
              echo "== $label (attempt $attempt/$max) =="
              echo "$json" | head -c 1500; echo
              if [ "$http" != "200" ]; then
                echo "::warning::$label HTTP $http — retrying"
              elif echo "$json" | grep -qi 'iceberg table not found'; then
                echo "::warning::$label table missing — retrying"
              elif echo "$json" | grep -qi "$expect"; then
                return 0
              else
                echo "::warning::$label missing marker '$expect' — retrying"
              fi
              sleep $((attempt * 15))
            done
            echo "::error::$label failed after $max attempts"
            exit 1
          }

          assert_sql \
            "SELECT series_ticker, market_ticker, yes_bid, yes_ask, theme FROM options.kalshi_markets WHERE series_ticker = 'KXFED' ORDER BY fetched_at DESC LIMIT 5" \
            "KXFED" \
            "KXFED markets"

          assert_sql \
            "SELECT series_ticker, theme, related_symbol FROM options.kalshi_markets WHERE series_ticker = 'KXINX' ORDER BY fetched_at DESC LIMIT 5" \
            "equity_index\|SPY\|KXINX" \
            "KXINX equity index"

          assert_sql \
            "SELECT series_ticker, theme, related_symbol FROM options.kalshi_markets WHERE related_symbol = 'META' ORDER BY fetched_at DESC LIMIT 10" \
            "META\|company_event\|KXMETA" \
            "META company_event markets"

          echo "Kalshi markets pipeline verified."

      # Main-branch deploy-loader can overwrite this feature-branch Worker mid-run.
      # Redeploy once more at the end so kalshi-markets-hourly stays registered.
      - name: Final loader redeploy (beat main overwrite race)
        working-directory: loader
        run: |
          set -euo pipefail
          npx wrangler deploy
          echo "cboe-to-r2 final redeploy done."
          sleep 5
          curl -sS "$LOADER_URL/jobs/kalshi-markets-hourly" | tee /tmp/kalshi-job.json
          if ! grep -q '"ok":true' /tmp/kalshi-job.json; then
            echo "::warning::kalshi-markets-hourly still not in Worker registry after redeploy"
          fi
