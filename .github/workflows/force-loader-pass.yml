name: Force loader pass (market-closed override)

# One-click operator lever to run loader passes while the US market is closed
# (e.g. backfill the closing session's CBOE data) without flipping
# MARKET_HOURS_ENABLED=false on the Worker. Dispatches
# `POST /jobs/{job}/trigger?force=1` against the cboe-to-r2 loader — one pass
# per call, token-protected at the Worker edge using the LOADER_TOKEN GitHub
# secret (never printed, never needed locally). The loader loop resumes its
# normal wake/sleep schedule afterwards.
#
# Each pass processes up to LOADER_BATCH_SIZE (40) due items; a job with more
# due items (e.g. 80 newly added universe symbols) needs a second pass — set
# `passes` accordingly or just dispatch again. See loader/AGENTS.md
# "Market-closed override".

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Loader job to force'
        type: choice
        options:
          - cboe-options
          - ohlc-backfill
          - ohlc-daily
          - earnings-daily
          - fred-econ-daily
          - fred-yields-daily
          - fred-macro-daily
          - etf-daily
          - fundamentals-daily
          - futures-ohlc-daily
          - cfe-futures-daily
          - indices-ohlc-daily
          - crypto-spot-ohlc-daily
          - research-briefs-daily
          - sec-filings-daily
          - instruments-daily
          - kalshi-markets-hourly
          - kalshi-parlay-executor
        default: cboe-options
      passes:
        description: 'Number of forced passes to run (each handles up to 40 due items)'
        type: number
        default: 2

permissions:
  contents: read

jobs:
  force-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Force loader pass(es)
        env:
          LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
          LOADER_URL: https://cboe-to-r2.robertlancer.workers.dev
          JOB: ${{ inputs.job }}
          PASSES: ${{ inputs.passes }}
        run: |
          set -euo pipefail
          if [ -z "${LOADER_TOKEN:-}" ]; then
            echo "::error::LOADER_TOKEN secret is not set on this repository"
            exit 1
          fi
          # Kalshi passes are paced (RFQ wait + series gaps) and can outlive a
          # sync curl. async=1 + last_pass poll matches provision-kalshi-markets.
          async_job=0
          case "$JOB" in
            kalshi-*) async_job=1 ;;
          esac
          for i in $(seq 1 "$PASSES"); do
            echo "== forced pass $i/$PASSES: $JOB?force=1 =="
            if [ "$async_job" = "1" ]; then
              before_at=$(curl -sS "$LOADER_URL/jobs/$JOB" | jq -r '.job.last_pass.finished_at // .job.last_pass.at // empty')
              echo "before_at=$before_at"
              triggered=0
              for attempt in $(seq 1 40); do
                set +e
                resp=$(curl -sS -X POST \
                  -H "Authorization: Bearer $LOADER_TOKEN" \
                  -m 60 \
                  -w '\n__HTTP_%{http_code}' \
                  "$LOADER_URL/jobs/$JOB/trigger?force=1&async=1")
                curl_ec=$?
                set -e
                if [ "$curl_ec" -ne 0 ]; then
                  echo "trigger attempt $attempt: curl exit $curl_ec"
                  sleep 15
                  continue
                fi
                body="${resp%__HTTP_*}"
                code="${resp##*__HTTP_}"
                echo "trigger attempt $attempt: HTTP $code $body"
                if [ "$code" = "200" ] && echo "$body" | grep -q '"ok":true'; then
                  triggered=1
                  break
                fi
                if [ "$code" = "409" ]; then
                  echo "Loader busy (409) — retrying trigger."
                  sleep 15
                  continue
                fi
                echo "::warning::Worker trigger returned HTTP $code — retrying"
                sleep 15
              done
              if [ "$triggered" != "1" ]; then
                echo "::error::pass $i never accepted a trigger"
                exit 1
              fi
              for poll in $(seq 1 60); do
                status=$(curl -sS "$LOADER_URL/jobs/$JOB")
                after_at=$(echo "$status" | jq -r '.job.last_pass.finished_at // .job.last_pass.at // empty')
                echo "poll $poll: finished_at=$after_at"
                if [ -n "$after_at" ] && [ "$after_at" != "$before_at" ]; then
                  echo "$status" | jq '{ok, job_id:.job.job_id, last_pass:.job.last_pass}'
                  break
                fi
                if [ "$poll" = "60" ]; then
                  echo "::error::pass $i timed out waiting for last_pass"
                  echo "$status" | jq .
                  exit 1
                fi
                sleep 15
              done
            else
              resp=$(curl -sS -X POST \
                -H "Authorization: Bearer $LOADER_TOKEN" \
                -w '\n__HTTP_%{http_code}' \
                "$LOADER_URL/jobs/$JOB/trigger?force=1")
              body="${resp%__HTTP_*}"
              code="${resp##*__HTTP_}"
              echo "$body"
              if [ "$code" != "200" ] || ! echo "$body" | grep -q '"ok":true'; then
                echo "::error::pass $i returned HTTP $code — did not complete"
                exit 1
              fi
            fi
            sleep 5  # let D1 settle between passes so each sees the updated due set
          done

      - name: Report job status
        env:
          LOADER_URL: https://cboe-to-r2.robertlancer.workers.dev
          JOB: ${{ inputs.job }}
        run: |
          {
            echo "## Forced pass summary — \`$JOB\`"
            echo '```json'
            curl -sS "$LOADER_URL/jobs/$JOB"
            echo '```'
            echo "Next regular loop pass depends on the job's own cadence and the"
            echo "market-hours gate (see loader/AGENTS.md)."
          } >> "$GITHUB_STEP_SUMMARY"