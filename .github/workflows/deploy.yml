name: Deploy

# main       → prod Pages + screener-api Worker.
# Branches   → dev Pages + the shared screener-api-dev Worker, so preview UI
#              and backend always speak the same API contract.
#
# Frontend: `wrangler pages deploy frontend/dist`.
# Workers: `wrangler deploy` from worker/. Each Worker's secrets persist across
# redeploys; screener-api-dev is seeded once outside CI just like production.

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend + Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Materialize text-vs-image results
        env:
          API_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.lobster.mp' || 'https://api-dev.lobster.mp' }}
          DESIGN_ID: text-vs-image-v3
        run: cd frontend && npm run materialize:text-vs-image

      - name: Build
        env:
          VITE_API_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.lobster.mp' || 'https://api-dev.lobster.mp' }}
        run: cd frontend && npm run build

      - name: Test route page meta
        run: cd frontend && npm run test:unit

      - name: Check Pages meta worker
        run: test -s frontend/dist/_worker.js

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Typecheck Worker
        run: cd worker && npx tsc --noEmit

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy-prod:
    name: Deploy → production
    needs: [build, deploy-worker-prod]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: 'pages deploy frontend/dist --project-name robs-options-slop --branch main --commit-hash ${{ github.sha }} --commit-message "deploy(prod): ${{ github.sha }}"'

  deploy-worker-prod:
    name: Deploy → production (Worker)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      # (Re)inject the Tavily news key onto the deployed Worker so the secret
      # survives redeploys and stays in sync with its value here, mirroring how
      # R2_SQL_TOKEN is stored. `wrangler secret put` reads the value from stdin.
      - name: Set TAVILY_API_KEY secret on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.TAVILY_API_KEY }}" | npx wrangler secret put TAVILY_API_KEY --name screener-api
        working-directory: worker

      # FRED key is optional (/api/econ_calendar falls back to the keyless Fed
      # calendar); skipped until the secret exists. `secrets` is invalid in a
      # step-level `if`, so the guard lives in the shell command instead.
      - name: Set FRED_API_KEY secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.FRED_API_KEY }}" ]; then
            echo "${{ secrets.FRED_API_KEY }}" | npx wrangler secret put FRED_API_KEY --name screener-api
          else
            echo "FRED_API_KEY not set — skipping (keyless Fed-calendar fallback active)"
          fi
        working-directory: worker

      # OpenRouter site key used only by the Worker's server-side Copilot loop.
      # Guarded sync leaves any existing deployed secret intact when GitHub has
      # not been configured with a replacement.
      - name: Set OPEN_ROUTER_KEY secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.OPEN_ROUTER_KEY }}" ]; then
            echo "${{ secrets.OPEN_ROUTER_KEY }}" | npx wrangler secret put OPEN_ROUTER_KEY --name screener-api
          else
            echo "OPEN_ROUTER_KEY not set — skipping (Copilot remains unavailable without an existing secret)"
          fi
        working-directory: worker

      # Admin bearer token guarding GET /api/admin/chat_history (transcripts
      # with ip/user_id) and private lake SQL. Tool-call debug is public
      # (GET /api/tool_calls). Same guarded pattern: synced here because
      # GitHub secrets are the project's de-facto secrets manager, and
      # skipped (leaving an existing value intact) until the GitHub secret
      # exists.
      - name: Set ADMIN_TOKEN secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN --name screener-api
          else
            echo "ADMIN_TOKEN not set — skipping (chat history admin endpoint stays closed)"
          fi
        working-directory: worker

      # Same LOADER_TOKEN the cboe-to-r2 Worker uses for /run and /symbols/enroll.
      # Copilot/research auto-enroll missing tickers via POST /symbols/enroll;
      # without this secret on screener-api enrollment is a soft no-op.
      - name: Set LOADER_TOKEN secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.LOADER_TOKEN }}" ]; then
            printf '%s' "${{ secrets.LOADER_TOKEN }}" | npx wrangler secret put LOADER_TOKEN --name screener-api
          else
            echo "LOADER_TOKEN not set — skipping (on-demand ticker enrollment stays off)"
          fi
        working-directory: worker

      # Fine-grained PAT (Issues: Read and write) so the timeline moderation
      # improvement reporter can open deduped GitHub issues. Optional.
      - name: Set IMPROVEMENT_ISSUE_TOKEN secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}" ]; then
            printf '%s' "${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}" | npx wrangler secret put IMPROVEMENT_ISSUE_TOKEN --name screener-api
          else
            echo "IMPROVEMENT_ISSUE_TOKEN not set — skipping (moderation still runs; no GitHub issues)"
          fi
        working-directory: worker

      # Better Auth (Google OAuth). Cookie is HttpOnly on .lobster.mp; the
      # Worker is the only writer of user_id. Guarded: skipped until the
      # GitHub secret exists so a missing value never clobbers a live secret.
      - name: Set BETTER_AUTH_SECRET secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler secret put BETTER_AUTH_SECRET --name screener-api
          else
            echo "BETTER_AUTH_SECRET not set — skipping (optional Copilot login stays off)"
          fi
        working-directory: worker

      - name: Set GOOGLE_CLIENT_ID secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "${{ secrets.GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID --name screener-api
          else
            echo "GOOGLE_CLIENT_ID not set — skipping (optional Copilot login stays off)"
          fi
        working-directory: worker

      - name: Set GOOGLE_CLIENT_SECRET secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET --name screener-api
          else
            echo "GOOGLE_CLIENT_SECRET not set — skipping (optional Copilot login stays off)"
          fi
        working-directory: worker

      # Apply pending D1 migrations to the REMOTE database explicitly BEFORE
      # deploy. wrangler's auto-apply-on-deploy prompt never fires when the
      # runner has no TTY (wrangler-action) — the 0003_shared_chats.sql deploy
      # missed this way, leaving the share table missing in prod until applied
      # by hand. In non-interactive environments `migrations apply` skips the
      # confirmation itself. `wrangler deploy` then has no pending migrations.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply screener-schema-cache --remote
        working-directory: worker

      - name: Deploy screener-api Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env=""

  deploy-worker-dev:
    name: Deploy → dev (Worker)
    needs: build
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      # Secrets are pre-seeded on screener-api-dev and survive redeploys. Never
      # copy production secret values through the browser or repository.
      # Auth secrets are synced here so preview can sign in on the shared
      # parent domain (dev.lobster.mp → api-dev.lobster.mp) without waiting
      # for a main deploy. ADMIN_TOKEN too — preview agents debug via
      # api-dev.lobster.mp/api/admin/chat_history. LOADER_TOKEN enables
      # on-demand ticker enrollment against cboe-to-r2 from preview Copilot.
      - name: Set ADMIN_TOKEN secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            printf '%s' "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN --name screener-api-dev
          else
            echo "ADMIN_TOKEN not set — skipping (chat history admin endpoint stays closed on preview)"
          fi
        working-directory: worker

      - name: Set LOADER_TOKEN secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.LOADER_TOKEN }}" ]; then
            printf '%s' "${{ secrets.LOADER_TOKEN }}" | npx wrangler secret put LOADER_TOKEN --name screener-api-dev
          else
            echo "LOADER_TOKEN not set — skipping (on-demand ticker enrollment stays off on preview)"
          fi
        working-directory: worker

      - name: Set IMPROVEMENT_ISSUE_TOKEN secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}" ]; then
            printf '%s' "${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}" | npx wrangler secret put IMPROVEMENT_ISSUE_TOKEN --name screener-api-dev
          else
            echo "IMPROVEMENT_ISSUE_TOKEN not set — skipping (preview moderation will not file issues)"
          fi
        working-directory: worker

      # Preview Copilot + share title/NER tags need the same OpenRouter key as
      # production. Guarded so a missing GitHub secret never clobbers a seeded value.
      - name: Set OPEN_ROUTER_KEY secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.OPEN_ROUTER_KEY }}" ]; then
            echo "${{ secrets.OPEN_ROUTER_KEY }}" | npx wrangler secret put OPEN_ROUTER_KEY --name screener-api-dev
          else
            echo "OPEN_ROUTER_KEY not set — skipping (share NER / preview Copilot stay off without an existing secret)"
          fi
        working-directory: worker

      - name: Set BETTER_AUTH_SECRET secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler secret put BETTER_AUTH_SECRET --name screener-api-dev
          else
            echo "BETTER_AUTH_SECRET not set — skipping (optional Copilot login stays off on preview)"
          fi
        working-directory: worker

      - name: Set GOOGLE_CLIENT_ID secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "${{ secrets.GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID --name screener-api-dev
          else
            echo "GOOGLE_CLIENT_ID not set — skipping"
          fi
        working-directory: worker

      - name: Set GOOGLE_CLIENT_SECRET secret on screener-api-dev (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET --name screener-api-dev
          else
            echo "GOOGLE_CLIENT_SECRET not set — skipping"
          fi
        working-directory: worker

      # Same D1 as production (screener-schema-cache). Additive CREATE TABLE
      # migrations must land before the preview Worker serves /api/auth and
      # /api/chats; wrangler will not prompt in CI.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply screener-schema-cache --remote
        working-directory: worker

      - name: Deploy screener-api-dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env dev

  deploy-dev:
    name: Deploy → dev
    needs: [build, deploy-worker-dev]
    # Run for any non-main push, any PR targeting main, or manual dispatch
    # (unless manually dispatched on main, where deploy-prod handles it).
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Resolve branch name
        id: br
        run: |
          # For PRs use the head branch; otherwise the pushed branch name.
          if [ -n "${{ github.head_ref }}" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch ${{ steps.br.outputs.branch }}
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev): ${{ github.sha }}"

      # Stable dev URL (https://robs-options-slop-dev.pages.dev/): this project's
      # production branch is `dev`, so every dev build also lands here and uses
      # the matching screener-api-dev Worker. Skip on pull_request — push already
      # deploys the same tip, and dual push+PR runs race on `--branch dev`
      # (Cloudflare "Unknown internal error").
      - name: Deploy to Cloudflare Pages (stable dev URL)
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch dev
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev-stable): ${{ github.sha }}"
