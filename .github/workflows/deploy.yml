name: Deploy

# main       → prod Pages + screener-api Worker.
# Branches   → dev Pages + the shared screener-api-dev Worker, so preview UI
#              and backend always speak the same API contract.
#
# Frontend: `wrangler pages deploy frontend/dist`.
# Workers: `wrangler deploy` from worker/. Secrets persist across redeploys.
# GitHub → Worker secret sync runs *after* publish (retry on Cloudflare 503);
# a secret-put flake must not skip Worker or Pages.

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend + Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Materialize text-vs-image results
        env:
          API_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.lobster.mp' || 'https://api-dev.lobster.mp' }}
          DESIGN_ID: text-vs-image-v3
        run: cd frontend && npm run materialize:text-vs-image

      - name: Build
        env:
          VITE_API_BASE: ${{ github.ref == 'refs/heads/main' && 'https://api.lobster.mp' || 'https://api-dev.lobster.mp' }}
        run: cd frontend && npm run build

      - name: Test route page meta
        run: cd frontend && npm run test:unit

      - name: Check Pages meta worker
        run: test -s frontend/dist/_worker.js

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Typecheck Worker
        run: cd worker && npx tsc --noEmit

      - name: Test Worker secret-sync script
        run: bash .github/scripts/sync-screener-secrets.test.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy-prod:
    name: Deploy → production
    needs: [build, deploy-worker-prod]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: 'pages deploy frontend/dist --project-name robs-options-slop --branch main --commit-hash ${{ github.sha }} --commit-message "deploy(prod): ${{ github.sha }}"'

  deploy-worker-prod:
    name: Deploy → production (Worker)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      # Secrets persist across `wrangler deploy`. Do not `secret put` before
      # publish — a Cloudflare 503 on PUT /secrets skipped Worker + Pages
      # (2026-09-14, BETTER_AUTH_SECRET) and left api.lobster.mp on the previous
      # build. GitHub → Worker sync runs after this job succeeds.

      # Apply pending D1 migrations to the REMOTE database explicitly BEFORE
      # deploy. wrangler's auto-apply-on-deploy prompt never fires when the
      # runner has no TTY (wrangler-action) — the 0003_shared_chats.sql deploy
      # missed this way, leaving the share table missing in prod until applied
      # by hand. In non-interactive environments `migrations apply` skips the
      # confirmation itself. `wrangler deploy` then has no pending migrations.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply screener-schema-cache --remote
        working-directory: worker

      - name: Deploy screener-api Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env=""

  # GitHub is the secrets store; Worker secrets persist across deploys. Sync
  # after publish so a Cloudflare 503 on PUT /secrets cannot skip Worker/Pages.
  # continue-on-error: code already shipped; remaining 503s are logged, not a
  # rollback. Empty GitHub values skip so they never clobber a live secret.
  sync-worker-prod-secrets:
    name: Sync production Worker secrets
    needs: deploy-worker-prod
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Sync GitHub secrets onto screener-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
          IMPROVEMENT_ISSUE_TOKEN: ${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
        run: bash ../.github/scripts/sync-screener-secrets.sh screener-api
        working-directory: worker

  deploy-worker-dev:
    name: Deploy → dev (Worker)
    needs: build
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      # Secrets are pre-seeded on screener-api-dev and survive redeploys.
      # Sync after publish (sync-worker-dev-secrets) so a 503 on secret put
      # cannot skip the preview Worker. Never copy production secret values
      # through the browser or repository.

      # Same D1 as production (screener-schema-cache). Additive CREATE TABLE
      # migrations must land before the preview Worker serves /api/auth and
      # /api/chats; wrangler will not prompt in CI.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply screener-schema-cache --remote
        working-directory: worker

      - name: Deploy screener-api-dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env dev

  sync-worker-dev-secrets:
    name: Sync preview Worker secrets
    needs: deploy-worker-dev
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Sync GitHub secrets onto screener-api-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_ROUTER_KEY: ${{ secrets.OPEN_ROUTER_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
          IMPROVEMENT_ISSUE_TOKEN: ${{ secrets.IMPROVEMENT_ISSUE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
        run: bash ../.github/scripts/sync-screener-secrets.sh screener-api-dev
        working-directory: worker

  deploy-dev:
    name: Deploy → dev
    needs: [build, deploy-worker-dev]
    # Run for any non-main push, any PR targeting main, or manual dispatch
    # (unless manually dispatched on main, where deploy-prod handles it).
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      # Same-repo PRs already deploy from the branch push (same tip, same
      # --branch). A second pull_request run races Pages and flakes on
      # download-artifact 403 ("Error from intermediary"). Fork PRs have no
      # push event on this repo, so they still deploy here.
      - name: Decide whether to deploy Pages
        id: pages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate Pages deploy on the pull_request event; the branch push run deploys this tip."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pages.outputs.deploy == 'true'

      - name: Download dist artifact
        if: steps.pages.outputs.deploy == 'true'
        id: dist
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Retry download dist artifact
        if: steps.pages.outputs.deploy == 'true' && steps.dist.outcome == 'failure'
        run: sleep 20

      - name: Download dist artifact (retry)
        if: steps.pages.outputs.deploy == 'true' && steps.dist.outcome == 'failure'
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Resolve branch name
        if: steps.pages.outputs.deploy == 'true'
        id: br
        run: |
          # For PRs use the head branch; otherwise the pushed branch name.
          if [ -n "${{ github.head_ref }}" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (dev)
        if: steps.pages.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch ${{ steps.br.outputs.branch }}
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev): ${{ github.sha }}"

      # Stable dev URL (https://robs-options-slop-dev.pages.dev/): this project's
      # production branch is `dev`, so every dev build also lands here and uses
      # the matching screener-api-dev Worker. Skip on pull_request — push already
      # deploys the same tip, and dual push+PR runs race on `--branch dev`
      # (Cloudflare "Unknown internal error").
      - name: Deploy to Cloudflare Pages (stable dev URL)
        if: steps.pages.outputs.deploy == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch dev
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev-stable): ${{ github.sha }}"
