name: Deploy

# main       → prod (Cloudflare Pages project: robs-options-slop, custom domain: lobster.mp)
#              + screener-api Worker (workers.dev) via `wrangler deploy`.
# Branches  → dev  (Cloudflare Pages project: robs-options-slop-dev)
#
# Frontend: `wrangler pages deploy frontend/dist`.
# Worker:   `wrangler deploy` (in worker/). The Worker's R2_SQL_TOKEN secret
#           is stored on the deployed Worker and persists across deploys, so
#           CI needs only the Cloudflare API token + account id (GitHub
#           Actions secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend + Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Install Worker dependencies
        run: cd worker && npm ci

      - name: Typecheck Worker
        run: cd worker && npx tsc --noEmit

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy-prod:
    name: Deploy → production
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Deploy to Cloudflare Pages (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: 'pages deploy frontend/dist --project-name robs-options-slop --branch main --commit-hash ${{ github.sha }} --commit-message "deploy(prod): ${{ github.sha }}"'

  deploy-worker-prod:
    name: Deploy → production (Worker)
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: cd worker && npm ci

      # (Re)inject the Tavily news key onto the deployed Worker so the secret
      # survives redeploys and stays in sync with its value here, mirroring how
      # R2_SQL_TOKEN is stored. `wrangler secret put` reads the value from stdin.
      - name: Set TAVILY_API_KEY secret on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.TAVILY_API_KEY }}" | npx wrangler secret put TAVILY_API_KEY --name screener-api
        working-directory: worker

      # FRED key is optional (/api/econ_calendar falls back to the keyless Fed
      # calendar); skipped until the secret exists. `secrets` is invalid in a
      # step-level `if`, so the guard lives in the shell command instead.
      - name: Set FRED_API_KEY secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.FRED_API_KEY }}" ]; then
            echo "${{ secrets.FRED_API_KEY }}" | npx wrangler secret put FRED_API_KEY --name screener-api
          else
            echo "FRED_API_KEY not set — skipping (keyless Fed-calendar fallback active)"
          fi
        working-directory: worker

      # OpenRouter site key funding free anonymous chats (/api/free/*). Same
      # guarded pattern as FRED: keeps the deployed secret in sync, and skips
      # (leaving any existing value intact) until the GitHub secret exists.
      - name: Set OPEN_ROUTER_KEY secret on Worker (if configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.OPEN_ROUTER_KEY }}" ]; then
            echo "${{ secrets.OPEN_ROUTER_KEY }}" | npx wrangler secret put OPEN_ROUTER_KEY --name screener-api
          else
            echo "OPEN_ROUTER_KEY not set — skipping (free chats stay credit-gated closed)"
          fi
        working-directory: worker

      - name: Deploy screener-api Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  deploy-dev:
    name: Deploy → dev
    needs: build
    # Run for any non-main push, any PR targeting main, or manual dispatch
    # (unless manually dispatched on main, where deploy-prod handles it).
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: frontend/dist

      - name: Resolve branch name
        id: br
        run: |
          # For PRs use the head branch; otherwise the pushed branch name.
          if [ -n "${{ github.head_ref }}" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch ${{ steps.br.outputs.branch }}
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev): ${{ github.sha }}"

      # Stable dev URL (https://robs-options-slop-dev.pages.dev/): this project's
      # production branch is `dev`, so every dev build also lands here,
      # clobbering the previous build. Unlike the per-branch URLs above, the
      # origin never changes — the browser localStorage (OpenRouter login) on
      # this URL persists across deploys, so testing needs no re-login.
      - name: Deploy to Cloudflare Pages (stable dev URL)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy frontend/dist
            --project-name robs-options-slop-dev
            --branch dev
            --commit-hash ${{ github.sha }}
            --commit-message "deploy(dev-stable): ${{ github.sha }}"
