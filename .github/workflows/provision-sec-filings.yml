name: Provision SEC filings pipeline

# One-shot: create cboe_sec_filings_* if missing, set PIPELINE_SEC_FILINGS_URL,
# redeploy loader so the DO sees the secret, force sec-filings-daily, wait for
# the ~300s sink roll, then assert rows via production /api/query + filings API.
#
# Required GitHub secrets (same set as CFE/fundamentals provision):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_DATA_CATALOG_TOKEN,
#   PIPELINE_AUTH_TOKEN, LOADER_TOKEN
# Optional: PIPELINES_ADMIN_TOKEN (Pipelines Edit if deploy token lacks it)
#
# Trigger: workflow_dispatch, or push to cursor/run-provision-sec-filings-b078
# (gh workflow_dispatch is 403 for the Cursor integration token).

on:
  workflow_dispatch:
  push:
    branches: ['cursor/run-provision-sec-filings-b078']

concurrency:
  group: provision-sec-filings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      PIPELINE_AUTH_TOKEN: ${{ secrets.PIPELINE_AUTH_TOKEN }}
      PIPELINES_ADMIN_TOKEN: ${{ secrets.PIPELINES_ADMIN_TOKEN }}
      LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
      STREAM: cboe_sec_filings_v2
      SINK: cboe_sec_filings_sink
      PIPELINE: cboe_sec_filings_pipeline
      BUCKET: cboe-options-data
      LOADER_URL: https://cboe-to-r2.robertlancer.workers.dev
      WORKER_QUERY_URL: https://api.lobster.mp/api/query
      WORKER_FILINGS_URL: https://api.lobster.mp/api/research
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require secrets
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_DATA_CATALOG_TOKEN PIPELINE_AUTH_TOKEN LOADER_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Secrets present (values not printed)."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loader/package-lock.json

      - name: Install loader dependencies
        run: cd loader && npm ci

      - name: Provision stream / sink / pipeline
        working-directory: loader
        run: |
          set -euo pipefail

          PIPELINES_TOKEN="${PIPELINES_ADMIN_TOKEN:-}"
          if [ -z "$PIPELINES_TOKEN" ]; then
            PIPELINES_TOKEN="$CLOUDFLARE_API_TOKEN"
          fi

          wrangler_pipelines() {
            CLOUDFLARE_API_TOKEN="$PIPELINES_TOKEN" npx wrangler "$@"
          }

          try_list() {
            wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
              && return 0
            if [ "$PIPELINES_TOKEN" != "$R2_DATA_CATALOG_TOKEN" ]; then
              echo "Deploy token cannot list pipelines — retrying with R2_DATA_CATALOG_TOKEN"
              PIPELINES_TOKEN="$R2_DATA_CATALOG_TOKEN"
              wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
                && return 0
            fi
            echo "::error::No available token can manage Pipelines (need Pipelines Edit)."
            cat /tmp/streams.err >&2 || true
            return 1
          }
          try_list

          if wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json" 2>/dev/null; then
            echo "Stream $STREAM already exists"
          else
            echo "Creating stream $STREAM"
            wrangler_pipelines pipelines streams create "$STREAM" \
              --schema-file schemas/sec_filings.json \
              --http-enabled true \
              --http-auth true
            wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json"
          fi

          ENDPOINT=$(node -e "const s=require('/tmp/${STREAM}.json'); if(!s.endpoint) process.exit(2); process.stdout.write(s.endpoint)")
          echo "PIPELINE_SEC_FILINGS_URL=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Stream endpoint captured (value not printed)."

          if wrangler_pipelines pipelines sinks get "$SINK" --json >"/tmp/${SINK}.json" 2>/dev/null; then
            echo "Sink $SINK already exists"
          else
            echo "Creating sink $SINK (creates options.sec_filings)"
            wrangler_pipelines pipelines sinks create "$SINK" \
              --type r2-data-catalog \
              --bucket "$BUCKET" \
              --namespace options \
              --table sec_filings \
              --catalog-token "$R2_DATA_CATALOG_TOKEN" \
              --format parquet \
              --roll-interval 300
          fi

          if wrangler_pipelines pipelines get "$PIPELINE" --json >"/tmp/${PIPELINE}.json" 2>/dev/null; then
            echo "Pipeline $PIPELINE already exists"
          else
            echo "Creating pipeline $PIPELINE"
            wrangler_pipelines pipelines create "$PIPELINE" \
              --sql "INSERT INTO ${SINK} SELECT * FROM ${STREAM}"
          fi

      - name: Set PIPELINE_SEC_FILINGS_URL Worker secret
        working-directory: loader
        run: |
          set -euo pipefail
          printf '%s' "$PIPELINE_SEC_FILINGS_URL" | npx wrangler secret put PIPELINE_SEC_FILINGS_URL
          echo "Worker secret PIPELINE_SEC_FILINGS_URL updated."

      - name: Redeploy loader so EtlScheduler DO picks up the secret
        working-directory: loader
        run: |
          set -euo pipefail
          npx wrangler deploy
          echo "cboe-to-r2 redeployed."

      - name: Publish sample tickers directly (bypass DO)
        working-directory: loader
        run: |
          set -euo pipefail
          # Self-contained probe (no .ts imports) — same pattern as fundamentals_probe_publish.mjs.
          node tools/sec_filings_probe_publish.mjs AAPL SPY IBIT

      - name: Force sec-filings-daily (Worker path)
        run: |
          set -euo pipefail
          sleep 5
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $LOADER_TOKEN" \
            -w '\n__HTTP_%{http_code}' \
            "$LOADER_URL/jobs/sec-filings-daily/trigger?force=1")
          body="${resp%__HTTP_*}"
          code="${resp##*__HTTP_}"
          echo "$body"
          if [ "$code" = "409" ]; then
            echo "Loader busy (409) — direct publish already landed rows; continuing."
            exit 0
          fi
          if [ "$code" != "200" ] || ! echo "$body" | grep -q '"ok":true'; then
            echo "::warning::Worker trigger returned HTTP $code — direct publish still counts"
          fi
          sleep 3
          status=$(curl -sS "$LOADER_URL/jobs/sec-filings-daily")
          echo "$status" | jq '{job_id:.job.job_id, last_pass:(.job.last_pass|{run_id,duration_ms,failed,succeeded,attempted})}'
          dur=$(echo "$status" | jq -r '.job.last_pass.duration_ms // 0')
          if [ "$dur" = "0" ]; then
            echo "::warning::Worker pass still looks dry-run; secrets may need another cycle. Direct publish already sent rows."
          fi

      - name: Wait for sink roll (~5 min)
        run: |
          echo "Lake sinks flush on a ~300s roll interval — waiting 360s."
          sleep 360

      - name: Assert sec_filings rows
        run: |
          set -euo pipefail
          assert_sql() {
            local sql="$1" expect="$2" label="$3"
            body=$(jq -nc --arg sql "$sql" '{sql:$sql, limit:20}')
            resp=$(curl -sS -X POST "$WORKER_QUERY_URL" \
              -H 'content-type: application/json' \
              -d "$body" \
              -w '\n__HTTP_%{http_code}')
            http="${resp##*__HTTP_}"
            json="${resp%__HTTP_*}"
            echo "== $label =="
            echo "$json" | head -c 1500; echo
            if [ "$http" != "200" ]; then
              echo "::error::$label HTTP $http"
              exit 1
            fi
            if echo "$json" | grep -qi 'iceberg table not found'; then
              echo "::error::$label table missing after sink roll"
              exit 1
            fi
            if ! echo "$json" | grep -qi "$expect"; then
              echo "::error::$label missing expected marker '$expect'"
              exit 1
            fi
          }

          assert_sql \
            "SELECT ticker, form_type, kind, filed_at FROM options.sec_filings WHERE ticker = 'AAPL' ORDER BY filed_at DESC LIMIT 5" \
            "10-" \
            "AAPL filings"

          assert_sql \
            "SELECT ticker, form_type, kind, filed_at FROM options.sec_filings WHERE ticker = 'SPY' ORDER BY filed_at DESC LIMIT 5" \
            "prospectus\|485\|N-1A\|497\|SPY" \
            "SPY prospectus"

          for t in AAPL SPY; do
            resp=$(curl -sS "$WORKER_FILINGS_URL/$t/filings?limit=5")
            echo "== API $t =="
            echo "$resp" | head -c 800; echo
            count=$(echo "$resp" | jq -r '.count // 0')
            if [ "$count" = "0" ]; then
              echo "::error::/api/research/$t/filings returned count=0"
              exit 1
            fi
          done

          echo "SEC filings pipeline verified."
