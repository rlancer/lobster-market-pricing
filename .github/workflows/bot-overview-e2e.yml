name: Bot overview e2e

# Headless @nowlobster (or another scheduled public bot) on api-dev.
# Proves get_market_tape lands and the original unfiltered option_contracts
# GROUP BY does not. Uses ADMIN_TOKEN from repo secrets — never printed.
#
#   gh workflow run "Bot overview e2e" --ref <branch> -f count=3

on:
  workflow_dispatch:
    inputs:
      handle:
        description: Public bot handle with a schedule
        type: string
        default: nowlobster
      count:
        description: Sequential force-trigger runs
        type: string
        default: "3"
      api_base:
        description: API origin
        type: string
        default: https://api-dev.lobster.mp
      qa_title:
        description: Test-run batch title (admin /admin/test-runs)
        type: string
        default: "@nowlobster overview tape"
      qa_description:
        description: Bug / assertion this batch is proving
        type: string
        default: "Assert get_market_tape and no unfiltered option_contracts GROUP BY (portfolio schema leak)."
      qa_pr_url:
        description: Associated pull request URL
        type: string
        default: "https://github.com/rlancer/lobster-market-pricing/pull/328"

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker test runner
        run: cd worker && npm ci

      - name: Force-trigger overview runs and assert tape
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HANDLE: ${{ inputs.handle }}
          COUNT: ${{ inputs.count }}
          API_BASE: ${{ inputs.api_base }}
          QA_TITLE: ${{ inputs.qa_title }}
          QA_DESCRIPTION: ${{ inputs.qa_description }}
          QA_PR_URL: ${{ inputs.qa_pr_url }}
        run: bash worker/tools/run-bot-overview-e2e.sh
