name: Provision CFE futures pipes (one-shot)

# Provision cboe_futures_settlements_* + cboe_futures_quotes_* if missing, set
# loader Worker secrets, force cfe-futures-daily, wait for the ~300s sink roll,
# then assert rows via production /api/query. workflow_dispatch only.
#
# Required GitHub secrets (same set as fundamentals provision):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_DATA_CATALOG_TOKEN,
#   PIPELINE_AUTH_TOKEN, LOADER_TOKEN
# Optional: PIPELINES_ADMIN_TOKEN (Pipelines Edit if deploy token lacks it)

on:
  workflow_dispatch:

concurrency:
  group: provision-cfe-futures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      PIPELINE_AUTH_TOKEN: ${{ secrets.PIPELINE_AUTH_TOKEN }}
      PIPELINES_ADMIN_TOKEN: ${{ secrets.PIPELINES_ADMIN_TOKEN }}
      LOADER_TOKEN: ${{ secrets.LOADER_TOKEN }}
      BUCKET: cboe-options-data
      LOADER_URL: https://cboe-to-r2.robertlancer.workers.dev
      WORKER_QUERY_URL: https://api.lobster.mp/api/query
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require secrets
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_DATA_CATALOG_TOKEN PIPELINE_AUTH_TOKEN LOADER_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Secrets present (values not printed)."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: loader/package-lock.json

      - name: Install loader dependencies
        run: cd loader && npm ci

      - name: Provision settlements + quotes streams/sinks/pipelines
        working-directory: loader
        run: |
          set -euo pipefail

          PIPELINES_TOKEN="${PIPELINES_ADMIN_TOKEN:-}"
          if [ -z "$PIPELINES_TOKEN" ]; then
            PIPELINES_TOKEN="$CLOUDFLARE_API_TOKEN"
          fi

          wrangler_pipelines() {
            CLOUDFLARE_API_TOKEN="$PIPELINES_TOKEN" npx wrangler "$@"
          }

          try_list() {
            wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
              && return 0
            if [ "$PIPELINES_TOKEN" != "$R2_DATA_CATALOG_TOKEN" ]; then
              echo "Deploy token cannot list pipelines — retrying with R2_DATA_CATALOG_TOKEN"
              PIPELINES_TOKEN="$R2_DATA_CATALOG_TOKEN"
              wrangler_pipelines pipelines streams list --json >/tmp/streams.json 2>/tmp/streams.err \
                && return 0
            fi
            echo "::error::No available token can manage Pipelines (need Pipelines Edit)."
            cat /tmp/streams.err >&2 || true
            return 1
          }
          try_list

          provision_one() {
            local STREAM="$1" SINK="$2" PIPELINE="$3" SCHEMA="$4" TABLE="$5" SECRET_NAME="$6"
            if wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json" 2>/dev/null; then
              echo "Stream $STREAM already exists"
            else
              echo "Creating stream $STREAM"
              wrangler_pipelines pipelines streams create "$STREAM" \
                --schema-file "$SCHEMA" \
                --http-enabled true \
                --http-auth true
              wrangler_pipelines pipelines streams get "$STREAM" --json >"/tmp/${STREAM}.json"
            fi
            ENDPOINT=$(node -e "const s=require('/tmp/${STREAM}.json'); if(!s.endpoint) process.exit(2); process.stdout.write(s.endpoint)")
            echo "${SECRET_NAME}=$ENDPOINT" >> "$GITHUB_ENV"
            echo "$SECRET_NAME set (endpoint not printed)."

            if wrangler_pipelines pipelines sinks get "$SINK" --json >"/tmp/${SINK}.json" 2>/dev/null; then
              echo "Sink $SINK already exists"
            else
              echo "Creating sink $SINK (creates options.${TABLE})"
              wrangler_pipelines pipelines sinks create "$SINK" \
                --type r2-data-catalog \
                --bucket "$BUCKET" \
                --namespace options \
                --table "$TABLE" \
                --catalog-token "$R2_DATA_CATALOG_TOKEN" \
                --format parquet \
                --roll-interval 300
            fi

            if wrangler_pipelines pipelines get "$PIPELINE" --json >"/tmp/${PIPELINE}.json" 2>/dev/null; then
              echo "Pipeline $PIPELINE already exists"
            else
              echo "Creating pipeline $PIPELINE"
              wrangler_pipelines pipelines create "$PIPELINE" \
                --sql "INSERT INTO ${SINK} SELECT * FROM ${STREAM}"
            fi
          }

          provision_one \
            cboe_futures_settlements_v2 \
            cboe_futures_settlements_sink \
            cboe_futures_settlements_pipeline \
            schemas/futures_settlements.json \
            futures_settlements \
            PIPELINE_FUTURES_SETTLEMENTS_URL

          provision_one \
            cboe_futures_quotes_v2 \
            cboe_futures_quotes_sink \
            cboe_futures_quotes_pipeline \
            schemas/futures_quotes.json \
            futures_quotes \
            PIPELINE_FUTURES_QUOTES_URL

      - name: Set loader Worker secrets
        working-directory: loader
        run: |
          set -euo pipefail
          printf '%s' "$PIPELINE_FUTURES_SETTLEMENTS_URL" | npx wrangler secret put PIPELINE_FUTURES_SETTLEMENTS_URL
          printf '%s' "$PIPELINE_FUTURES_QUOTES_URL" | npx wrangler secret put PIPELINE_FUTURES_QUOTES_URL
          echo "Worker secrets PIPELINE_FUTURES_SETTLEMENTS_URL + PIPELINE_FUTURES_QUOTES_URL updated."

      - name: Publish CFE settlements + quotes through new pipes
        working-directory: loader
        run: |
          set -euo pipefail
          # Publish directly (same code path as the job) so we don't depend on
          # Durable Object env refresh after secret put.
          node --experimental-strip-types tools/futures_cfe_publish.ts

      - name: Force cfe-futures-daily pass (Worker path smoke)
        run: |
          set -euo pipefail
          # Give the DO a moment; secret put is immediate for new isolates.
          sleep 5
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $LOADER_TOKEN" \
            -w '\n__HTTP_%{http_code}' \
            "$LOADER_URL/jobs/cfe-futures-daily/trigger?force=1")
          body="${resp%__HTTP_*}"
          code="${resp##*__HTTP_}"
          echo "$body"
          if [ "$code" = "409" ]; then
            echo "Loader busy (409) — direct publish already landed rows; continuing."
            exit 0
          fi
          if [ "$code" != "200" ] || ! echo "$body" | grep -q '"ok":true'; then
            echo "::warning::Worker trigger returned HTTP $code — direct publish still counts; checking status"
          fi
          sleep 3
          status=$(curl -sS "$LOADER_URL/jobs/cfe-futures-daily")
          echo "$status"
          dur=$(echo "$status" | jq -r '.job.last_pass.duration_ms // 0')
          failed=$(echo "$status" | jq -r '.job.last_pass.failed // 0')
          echo "last_pass duration_ms=$dur failed=$failed"
          if [ "$failed" != "0" ]; then
            echo "::error::cfe-futures-daily reported failures=$failed"
            exit 1
          fi
          # duration_ms=0 would mean dry-run (secrets not wired on Worker yet).
          if [ "$dur" = "0" ]; then
            echo "::warning::Worker pass still looks dry-run; secrets may need another deploy cycle. Direct publish already sent rows."
          fi

      - name: Wait for sink roll (~5 min)
        run: |
          echo "Lake sinks flush on a ~300s roll interval — waiting 360s."
          sleep 360

      - name: Assert CFE rows via /api/query
        run: |
          set -euo pipefail
          assert_sql() {
            local sql="$1" expect="$2" label="$3"
            body=$(jq -nc --arg sql "$sql" '{sql:$sql, limit:20}')
            resp=$(curl -sS -X POST "$WORKER_QUERY_URL" \
              -H 'content-type: application/json' \
              -d "$body" \
              -w '\n__HTTP_%{http_code}')
            http="${resp##*__HTTP_}"
            json="${resp%__HTTP_*}"
            echo "== $label =="
            echo "$json"
            if [ "$http" != "200" ]; then
              echo "::error::$label HTTP $http"
              exit 1
            fi
            if echo "$json" | grep -qi 'iceberg table not found'; then
              echo "::error::$label table missing after sink roll"
              exit 1
            fi
            if ! echo "$json" | grep -qi "$expect"; then
              echo "::error::$label missing expected marker '$expect'"
              exit 1
            fi
          }

          assert_sql \
            "SELECT product, contract_symbol, expiration_date, settle_price FROM options.futures_settlements WHERE product = 'VX' ORDER BY fetched_at DESC LIMIT 10" \
            "VX" \
            "futures_settlements"

          assert_sql \
            "SELECT root, contract_symbol, last, open_interest FROM options.futures_quotes WHERE root = 'VX' ORDER BY fetched_at DESC LIMIT 10" \
            "VX" \
            "futures_quotes"

          echo "CFE futures pipes verified."
