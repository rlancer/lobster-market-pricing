# Ephemeral debug: HTTP status codes for api-dev.lobster.mp + schwab paths.
# Trigger: push to cursor/run-debug-worker-logs-913d
name: Debug worker logs
on:
  push:
    branches:
      - cursor/run-debug-worker-logs-913d
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query HTTP status analytics for api-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          START=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Window $START → $END"

          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=lobster.mp" | tee zones.json > /dev/null
          ZONE=$(jq -r '.result[0].id // empty' zones.json)
          echo "ZONE=$ZONE"

          # No orderBy — enum differs by schema version.
          GQL=$(jq -n --arg zone "$ZONE" --arg start "$START" --arg end "$END" \
            '{query:("query {\n  viewer {\n    zones(filter:{zoneTag:\""+$zone+"\"}) {\n      httpRequestsAdaptiveGroups(\n        limit: 100\n        filter:{datetime_geq:\""+$start+"\", datetime_leq:\""+$end+"\", clientRequestHTTPHost:\"api-dev.lobster.mp\", clientRequestPath_like:\"/api/schwab%\"}\n      ) {\n        dimensions { datetimeFifteenMinutes clientRequestPath edgeResponseStatus }\n        sum { requests bytes }\n      }\n    }\n  }\n}")}')
          echo "== Schwab paths =="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/graphql" \
            -d "$GQL" | tee schwab-http.json | head -c 150000
          echo

          GQL2=$(jq -n --arg zone "$ZONE" --arg start "$START" --arg end "$END" \
            '{query:("query {\n  viewer {\n    zones(filter:{zoneTag:\""+$zone+"\"}) {\n      httpRequestsAdaptiveGroups(\n        limit: 50\n        filter:{datetime_geq:\""+$start+"\", datetime_leq:\""+$end+"\", clientRequestHTTPHost:\"api-dev.lobster.mp\", edgeResponseStatus_geq:400}\n      ) {\n        dimensions { clientRequestPath edgeResponseStatus clientRequestHTTPMethodName }\n        sum { requests }\n      }\n    }\n  }\n}")}')
          echo "== api-dev 4xx/5xx =="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/graphql" \
            -d "$GQL2" | tee errors-http.json | head -c 100000
          echo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-status-dump
          path: |
            zones.json
            schwab-http.json
            errors-http.json
          if-no-files-found: warn
