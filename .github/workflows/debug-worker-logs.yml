name: Debug worker logs
on:
  push:
    branches: [cursor/run-debug-worker-logs-913d]
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Introspect + query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          START=$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ZONE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=lobster.mp" | jq -r '.result[0].id')
          echo ZONE=$ZONE
          # Try sum { count } and sum { visits }
          for sumfield in count visits requests edgeResponseBytes; do
            echo "== try sum.$sumfield =="
            GQL=$(jq -n --arg zone "$ZONE" --arg start "$START" --arg end "$END" --arg sf "$sumfield" \
              '{query:("query {\n  viewer {\n    zones(filter:{zoneTag:\""+$zone+"\"}) {\n      httpRequestsAdaptiveGroups(\n        limit: 20\n        filter:{datetime_geq:\""+$start+"\", datetime_leq:\""+$end+"\", clientRequestHTTPHost:\"api-dev.lobster.mp\", clientRequestPath_like:\"/api/schwab%\"}\n      ) {\n        dimensions { clientRequestPath edgeResponseStatus }\n        sum { "+$sf+" }\n      }\n    }\n  }\n}")}')
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/graphql" -d "$GQL" | tee "try-$sumfield.json" | head -c 3000
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-status-dump
          path: try-*.json
