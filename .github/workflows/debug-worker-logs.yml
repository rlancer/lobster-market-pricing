# Ephemeral: live-tail screener-api-dev while hitting schwab endpoints is impossible
# without a user session — instead dump wrangler tails of recent buffered events
# and list Workers Logs via the dashboard-compatible API.
# Trigger: push to cursor/run-debug-worker-logs-913d
name: Debug worker logs
on:
  push:
    branches:
      - cursor/run-debug-worker-logs-913d
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wrangler
        working-directory: worker
        run: npm ci
      - name: Probe token scopes + workers logs APIs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          set -euo pipefail
          echo "== Token verify =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | tee /tmp/token-verify.json
          echo
          echo "== Account workers scripts =="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | tee /tmp/scripts.json | head -c 3000
          echo
          # Try several log endpoints used by the dashboard
          END_MS=$(($(date -u +%s)*1000))
          START_MS=$((END_MS - 6*60*60*1000))
          for path in \
            "workers/observability/telemetry/query" \
            "workers/observability/telemetry/keys" \
            "workers/observability/events" \
            "logs/retrieve"
            do
            echo "== POST/GET $path =="
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$path" \
              -d "{\"queryId\":\"workers-logs-events\",\"timeframe\":{\"from\":$START_MS,\"to\":$END_MS},\"view\":\"events\",\"limit\":50,\"parameters\":{\"datasets\":[\"cloudflare-workers\"],\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"screener-api-dev\"}],\"filterCombination\":\"and\",\"needle\":{\"value\":\"schwab\",\"isRegex\":false,\"matchCase\":false}}}" \
              | head -c 4000
            echo
          done
          echo "== Keys endpoint =="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys" \
            -d "{\"timeframe\":{\"from\":$START_MS,\"to\":$END_MS},\"datasets\":[\"cloudflare-workers\"],\"filters\":[],\"limit\":100,\"key\":\"\$metadata\"}" \
            | tee /tmp/keys.json | head -c 8000
          echo
          echo "== wrangler tail (15s, json) =="
          # Capture any live traffic; also useful to confirm auth for tails
          timeout 15 npx wrangler tail screener-api-dev --format json --status error 2>&1 | tee /tmp/tail.json || true
          echo "(tail ended)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-logs-dump2
          path: |
            /tmp/token-verify.json
            /tmp/scripts.json
            /tmp/keys.json
            /tmp/tail.json
          if-no-files-found: warn
