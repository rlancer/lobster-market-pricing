name: Email Service smoke test

# Operator lever to prove the Worker EMAIL binding can send from
# noreply@lobster.mp. Uses ADMIN_TOKEN (never printed) against api-dev by
# default. The Admin hub button remains the primary UX for signed-in admins.

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email (defaults to robert.lancer@gmail.com)'
        type: string
        default: robert.lancer@gmail.com
      target:
        description: 'API host'
        type: choice
        options:
          - api-dev
          - api
        default: api-dev
      trigger_bot:
        description: 'api-dev only — Run now the first enabled personal bot as robert.lancer@gmail.com'
        type: boolean
        default: false
      tick_prod:
        description: 'POST production /api/admin/bots/schedules/tick after dumping bot schedule state'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Service smoke test
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TO: ${{ inputs.to }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::ADMIN_TOKEN secret is not set on this repository"
            exit 1
          fi
          if [ "$TARGET" = "api" ]; then
            BASE="https://api.lobster.mp"
          else
            BASE="https://api-dev.lobster.mp"
          fi
          echo "POST $BASE/api/admin/email/test → $TO"
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg to "$TO" '{to:$to}')" \
            -w '\n__HTTP_%{http_code}' \
            "$BASE/api/admin/email/test")
          body="${resp%__HTTP_*}"
          code="${resp##*__HTTP_}"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::email smoke returned HTTP $code"
            exit 1
          fi
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"message_id"'

      - name: Assume admin account on api-dev
        if: ${{ inputs.target != 'api' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TRIGGER_BOT: ${{ inputs.trigger_bot }}
          TICK_PROD: ${{ inputs.tick_prod }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $ADMIN_TOKEN" -H "X-Dev-As: robert.lancer@gmail.com" -H "Content-Type: application/json")

          prod=$(curl -sS -o /tmp/prod.json -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"robert.lancer@gmail.com"}' \
            https://api.lobster.mp/api/admin/dev-session)
          echo "prod /api/admin/dev-session HTTP $prod"
          cat /tmp/prod.json; echo
          if [ "$prod" != "404" ]; then
            echo "::error::production impersonation must 404"
            exit 1
          fi

          me=$(curl -sS -o /tmp/me.json -w '%{http_code}' "${AUTH[@]}" \
            https://api-dev.lobster.mp/api/me)
          echo "dev /api/me HTTP $me"
          python3 - <<'PY'
          import json
          me = json.load(open("/tmp/me.json"))
          print("email", me.get("email"), "ok", me.get("ok"))
          if me.get("email") != "robert.lancer@gmail.com":
              raise SystemExit("expected robert.lancer@gmail.com")
          PY
          if [ "$me" != "200" ]; then
            echo "::error::api-dev /api/me rejected ADMIN_TOKEN impersonation"
            exit 1
          fi

          bots=$(curl -sS -o /tmp/bots.json -w '%{http_code}' "${AUTH[@]}" \
            https://api-dev.lobster.mp/api/me/bots)
          echo "dev /api/me/bots HTTP $bots"
          python3 - <<'PY'
          import json, datetime
          data = json.load(open("/tmp/bots.json"))
          items = data.get("items") or []
          print("bot_count", len(items))
          def ts(v):
            if v is None:
              return None
            return datetime.datetime.utcfromtimestamp(v / 1000).isoformat() + "Z"
          for bot in items:
              print(
                "bot", bot.get("bot_id"), bot.get("name"),
                "enabled=" + str(bot.get("enabled")),
                "email_alerts=" + str(bot.get("email_alerts")),
                "preset=" + str(bot.get("schedule_preset")),
                "market_gated=" + str(bot.get("market_gated")),
                "next=" + str(ts(bot.get("next_run_at"))),
                "last=" + str(ts(bot.get("last_run_at"))),
                "failures=" + str(bot.get("consecutive_failures")),
                "err=" + str(bot.get("last_error")),
              )
          open("/tmp/bot_id.txt", "w").write(next((b["bot_id"] for b in items if b.get("enabled")), ""))
          PY
          if [ "$bots" != "200" ]; then
            echo "::error::api-dev /api/me/bots failed"
            exit 1
          fi

          BOT_ID=$(cat /tmp/bot_id.txt)
          if [ -n "$BOT_ID" ]; then
            detail=$(curl -sS -o /tmp/bot_detail.json -w '%{http_code}' "${AUTH[@]}" \
              "https://api-dev.lobster.mp/api/me/bots/${BOT_ID}")
            echo "dev /api/me/bots/$BOT_ID HTTP $detail"
            python3 - <<'PY'
          import json, datetime
          data = json.load(open("/tmp/bot_detail.json"))
          bot = data.get("bot") or data
          def ts(v):
            if v is None:
              return None
            return datetime.datetime.utcfromtimestamp(v / 1000).isoformat() + "Z"
          print(json.dumps({
            "name": bot.get("name"),
            "enabled": bot.get("enabled"),
            "email_alerts": bot.get("email_alerts"),
            "schedule_preset": bot.get("schedule_preset"),
            "cadence_seconds": bot.get("cadence_seconds"),
            "market_gated": bot.get("market_gated"),
            "created_at_iso": ts(bot.get("created_at")),
            "next_run_at_iso": ts(bot.get("next_run_at")),
            "last_run_at_iso": ts(bot.get("last_run_at")),
            "last_error": bot.get("last_error"),
            "consecutive_failures": bot.get("consecutive_failures"),
          }, indent=2))
          runs = data.get("runs") or []
          print("runs", len(runs))
          for r in runs[:8]:
            print(json.dumps({
              "run_id": r.get("run_id"),
              "status": r.get("status"),
              "started_at": ts(r.get("started_at")),
              "finished_at": ts(r.get("finished_at")),
              "error": r.get("error"),
              "chat_id": r.get("chat_id"),
              "share_id": r.get("share_id"),
            }, default=str))
          PY
          fi

          mint=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"email":"robert.lancer@gmail.com"}' \
            https://api-dev.lobster.mp/api/admin/dev-session)
          echo "dev /api/admin/dev-session HTTP $mint"
          python3 - <<'PY'
          import json
          minted = json.load(open("/tmp/mint.json"))
          cookie = minted.get("cookie") or {}
          print("mint_ok", minted.get("ok"), "email", (minted.get("user") or {}).get("email"), "cookie", cookie.get("name"))
          if not minted.get("ok"):
              raise SystemExit("mint failed")
          PY
          if [ "$mint" != "200" ]; then
            echo "::error::dev-session mint failed"
            exit 1
          fi

          if [ "${TICK_PROD:-false}" = "true" ]; then
            echo "POST https://api.lobster.mp/api/admin/bots/schedules/tick"
            tick=$(curl -sS --max-time 300 -o /tmp/tick.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.lobster.mp/api/admin/bots/schedules/tick)
            echo "prod schedules/tick HTTP $tick"
            python3 -m json.tool /tmp/tick.json
            if [ -n "$BOT_ID" ]; then
              curl -sS -o /tmp/bot_after_tick.json "${AUTH[@]}" \
                "https://api-dev.lobster.mp/api/me/bots/${BOT_ID}"
              python3 - <<'PY'
          import json, datetime
          data = json.load(open("/tmp/bot_after_tick.json"))
          bot = data.get("bot") or data
          def ts(v):
            if v is None:
              return None
            return datetime.datetime.utcfromtimestamp(v / 1000).isoformat() + "Z"
          print(json.dumps({
            "after_tick_last_run_at_iso": ts(bot.get("last_run_at")),
            "after_tick_next_run_at_iso": ts(bot.get("next_run_at")),
            "after_tick_last_error": bot.get("last_error"),
            "after_tick_failures": bot.get("consecutive_failures"),
          }, indent=2))
          PY
            fi
          fi

          if [ "$TRIGGER_BOT" != "true" ]; then
            echo "Skipping Run now"
            exit 0
          fi
          if [ -z "$BOT_ID" ]; then
            echo "::error::no enabled personal bot to trigger"
            exit 1
          fi
          echo "POST /api/me/bots/$BOT_ID/trigger?force=1"
          trig=$(curl -sS --max-time 300 -o /tmp/trig.json -w '%{http_code}' -X POST "${AUTH[@]}" \
            "https://api-dev.lobster.mp/api/me/bots/${BOT_ID}/trigger?force=1")
          echo "trigger HTTP $trig"
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/trig.json"))
          print("trigger", {k: body.get(k) for k in ("ok", "error", "chat_id", "run_id", "share_id", "deferred", "reason", "email")})
          if not body.get("ok"):
              raise SystemExit(body.get("error") or "trigger failed")
          email = body.get("email")
          if isinstance(email, dict) and email.get("ok") is False:
              raise SystemExit(f"bot email failed: {email.get('error') or email}")
          PY
          if [ "$trig" != "200" ]; then
            echo "::error::bot trigger failed HTTP $trig"
            exit 1
          fi
